# ==============================================================================
# Database Tier: MongoDB StatefulSet & Headless Service
# ==============================================================================
# Educational Note:
# Why StatefulSet instead of a regular Deployment?
# 1. Stable Identity: Pods receive predictable, sticky hostnames (mongo-0).
# 2. Dedicated Storage: Each pod maintains its own EBS PersistentVolume across restarts.
# 3. Headless Service: 'clusterIP: None' avoids round-robin proxying, allowing
#    the backend to communicate directly with the specific database pod.
# 4. Security: MongoDB is strictly private within the Kubernetes cluster.
#    It is NEVER exposed via public LoadBalancer or NodePort.
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  namespace: cloudstudent
  labels:
    app.kubernetes.io/name: cloudstudent
    app.kubernetes.io/component: database
    app.kubernetes.io/tier: data
spec:
  clusterIP: None # Headless Service
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  selector:
    app.kubernetes.io/name: cloudstudent
    app.kubernetes.io/component: database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: cloudstudent
  labels:
    app.kubernetes.io/name: cloudstudent
    app.kubernetes.io/component: database
    app.kubernetes.io/tier: data
spec:
  serviceName: mongo-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudstudent
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudstudent
        app.kubernetes.io/component: database
        app.kubernetes.io/tier: data
    spec:
      serviceAccountName: cloudstudent-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cloudstudent-secret
                  key: MONGO_ROOT_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudstudent-secret
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: cloudstudent-config
                  key: MONGODB_DB
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Readiness Probe: ensures MongoDB is accepting queries before directing traffic
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness Probe: restarts container if MongoDB deadlocks
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  # Dynamic EBS Volume Provisioning Template
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          app.kubernetes.io/name: cloudstudent
          app.kubernetes.io/component: database
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-gp3-sc
        resources:
          requests:
            storage: 5Gi
