# ==============================================================================
# HorizontalPodAutoscaler (HPA) for Backend API
# ==============================================================================
# Educational Note:
# 1. HPA automatically adjusts the number of pods based on observed CPU and Memory usage.
# 2. Prerequisites: Requires the Kubernetes 'metrics-server' addon installed in your EKS cluster:
#      kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#    If metrics-server is missing, HPA will show '<unknown>' in the TARGETS column.
# 3. Capacity Warning: Autoscaling requires your AWS EC2 worker node group to have
#    sufficient spare capacity (or the AWS Cluster Autoscaler / Karpenter configured).
# ==============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: cloudstudent
  labels:
    app.kubernetes.io/name: cloudstudent
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # CPU Metric: Scale up when average CPU exceeds 70% of requested CPU (70m)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory Metric: Scale up when average Memory exceeds 80% of requested Memory (102.4Mi)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Stabilize for 5 minutes before scaling down to prevent flapping/thrashing
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
