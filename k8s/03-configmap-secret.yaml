# ==============================================================================
# ConfigMap and Secret for Configuration Decoupling
# ==============================================================================
# Educational Note:
# 12-Factor App methodology mandates decoupling configuration from code.
# - ConfigMap: Used for non-sensitive values like port numbers, hostnames, and environments.
# - Secret: Used for credentials, passwords, and connection strings.
#   Note: Using 'stringData' allows Kubernetes to automatically handle Base64 encoding.
#   In production AWS EKS, enable AWS KMS Envelope Encryption for secrets at rest.
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudstudent-config
  namespace: cloudstudent
  labels:
    app.kubernetes.io/name: cloudstudent
    app.kubernetes.io/component: config
data:
  PORT: "5000"
  NODE_ENV: "production"
  MONGODB_HOST: "mongo-headless"
  MONGODB_PORT: "27017"
  MONGODB_DB: "cloudstudent"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudstudent-secret
  namespace: cloudstudent
  labels:
    app.kubernetes.io/name: cloudstudent
    app.kubernetes.io/component: security
type: Opaque
stringData:
  # MongoDB Root & App Credentials
  # For local learning: change these values before production use!
  MONGO_ROOT_USER: "cloudadmin"
  MONGO_ROOT_PASSWORD: "SuperSecureEksPassword2026!"
  
  # Complete Connection URI used by Backend Pods
  MONGODB_URI: "mongodb://cloudadmin:SuperSecureEksPassword2026!@mongo-headless:27017/cloudstudent?authSource=admin"
