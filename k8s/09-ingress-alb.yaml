# ==============================================================================
# AWS Application Load Balancer (ALB) Ingress Manifest
# ==============================================================================
# Educational Note:
# How AWS Ingress Works:
# 1. You install the 'AWS Load Balancer Controller' in your EKS cluster.
# 2. When you apply this Ingress resource, the controller provisions an AWS Application
#    Load Balancer (ALB) across your VPC's public subnets.
# 3. 'target-type: ip' routes traffic directly from the ALB to the Pod IPs via the
#    AWS VPC CNI, skipping kube-proxy NodePort overhead for maximum performance.
# 4. Subnet Tagging Prerequisite: Public subnets MUST have the tag:
#    'kubernetes.io/role/elb: 1'
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudstudent-ingress
  namespace: cloudstudent
  labels:
    app.kubernetes.io/name: cloudstudent
    app.kubernetes.io/component: ingress
  annotations:
    # Specifies that the AWS Load Balancer Controller handles this Ingress
    kubernetes.io/ingress.class: alb
    
    # Creates an internet-facing public load balancer (use 'internal' for private VPCs)
    alb.ingress.kubernetes.io/scheme: internet-facing
    
    # 'ip' targets pods directly (requires AWS VPC CNI). 'instance' targets EC2 NodePorts.
    alb.ingress.kubernetes.io/target-type: ip
    
    # Listen on HTTP port 80 (for HTTPS, configure ACM certificate ARN)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    
    # Health check settings for AWS Target Groups
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # Frontend static web application
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
         
